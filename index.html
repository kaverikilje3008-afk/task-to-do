<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071522">
<meta name="description" content="A focused task dashboard by Kaveri Kilje.">
<title>My Tasks · Kaveri Kilje</title>
<style>
:root{color-scheme:dark;--bg:#071522;--sidebar:#091a28;--panel:#0e2231;--ink:#edf5f2;--muted:#a6b9bd;--green:#a8ed75;--line:rgba(217,242,229,.13);--danger:#e9a4a4;--shadow:0 20px 60px rgba(1,9,15,.25)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.app-shell{min-height:100vh}
.sidebar{width:264px;position:fixed;inset:0 auto 0 0;background:var(--sidebar);border-right:1px solid var(--line);padding:27px 18px;display:flex;flex-direction:column;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:780;letter-spacing:-.045em}
.brand-mark{width:43px;height:43px;border-radius:13px;background:linear-gradient(145deg,#b7f38b,#69bd7b);color:#092019;display:grid;place-items:center;font-size:21px;box-shadow:0 8px 24px #73ba6d36}
.brand b{color:var(--green)}
.menu-label,.eyebrow{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--green);font-weight:750}
.menu-label{margin:66px 0 14px 9px}
.nav-list{display:grid;gap:7px}
.nav-item{width:100%;border:1px solid transparent;color:var(--muted);background:transparent;border-radius:9px;padding:13px 12px;display:flex;align-items:center;gap:13px;text-align:left;transition:.2s}
.nav-item:hover{background:#102536;color:var(--ink)}
.nav-item.active{color:var(--ink);background:linear-gradient(105deg,#17392f,#112b31);border-color:#a8ed752c;box-shadow:inset 3px 0 var(--green)}
.nav-icon{width:22px;text-align:center;color:var(--green);font-size:18px}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:18px 4px 0;color:var(--muted);font-size:12px}
.side-bottom p{margin:0 0 7px}
.side-bottom a{color:var(--green)}
.main{margin-left:264px;min-height:100vh;padding:32px clamp(24px,4vw,60px) 48px}
.main-inner{max-width:1420px;margin:0 auto}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:35px}
.page-head h1{font-size:clamp(32px,3.2vw,43px);line-height:1.1;letter-spacing:-.045em;margin:8px 0 0}
.date-pill{border:1px solid var(--line);background:#0c1d2b;color:#c5d6d4;border-radius:9px;padding:11px 15px;font-size:13px;margin-top:4px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-bottom:40px}
.stat-card{min-height:145px;border:1px solid var(--line);border-radius:15px;padding:24px 26px;background:linear-gradient(145deg,#102838,#0c1d2b);box-shadow:var(--shadow)}
.stat-name{color:var(--muted);font-weight:550}
.stat-value{font-size:43px;line-height:1;font-weight:760;letter-spacing:-.04em;color:var(--green);margin-top:20px}
.tasks-panel{min-height:402px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#0c1e2d,#0b1b29);padding:28px clamp(18px,2vw,32px);box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.panel-head h2{font-size:25px;line-height:1.2;letter-spacing:-.035em;margin:6px 0 0}
.add-btn{border:0;border-radius:9px;padding:13px 18px;background:linear-gradient(135deg,#b7f38b,#76c87f);color:#0d241b;font-weight:750;box-shadow:0 8px 24px #7ecb7130;transition:transform .18s,filter .18s}
.add-btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
.search-wrap{position:relative;margin-bottom:19px;display:block}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#789095;font-size:16px;pointer-events:none}
.search{width:100%;height:52px;padding:0 15px 0 43px;border:1px solid var(--line);border-radius:9px;background:#091a27;color:var(--ink);outline:none}
.search::placeholder{color:#82979b}
.search:focus,.field input:focus,.field textarea:focus{border-color:#a8ed7580;box-shadow:0 0 0 3px #a8ed7512}
.task-list{display:grid;gap:10px}
.task-row{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:13px;padding:14px 15px;border:1px solid var(--line);border-radius:10px;background:#0d2130;transition:border-color .18s,background .18s}
.task-row:hover{border-color:#a8ed7548;background:#102838}
.task-check{appearance:none;width:19px;height:19px;border:1.5px solid #6a8582;border-radius:6px;display:grid;place-items:center;margin:0;cursor:pointer}
.task-check:checked{background:var(--green);border-color:var(--green)}
.task-check:checked:after{content:"✓";font-size:13px;font-weight:900;color:#10231a}
.task-copy{min-width:0}
.task-title{font-weight:630;overflow-wrap:anywhere}
.task-meta{color:var(--muted);font-size:12px;margin-top:3px}
.task-row.completed .task-title{text-decoration:line-through;color:#88a09f}
.task-row.completed .task-meta{opacity:.7}
.task-actions{display:flex;align-items:center;gap:9px}
.status{font-size:10px;letter-spacing:.04em;border:1px solid #a8ed7540;color:var(--green);background:#a8ed750c;padding:4px 8px;border-radius:99px;white-space:nowrap}
.status.done{color:#b3c8c2;border-color:var(--line);background:#ffffff08}
.delete-btn{border:0;background:transparent;color:#91a8a9;padding:6px;border-radius:6px}
.delete-btn:hover{background:#e9a4a414;color:var(--danger)}
.empty{min-height:150px;display:grid;align-content:center;justify-items:center;text-align:center;color:var(--muted);padding:25px}
.empty-icon{font-size:26px;color:var(--green);margin-bottom:8px}
.empty strong{color:#d5e5e1;font-weight:600}
.empty p{margin:5px 0 0;font-size:13px}
dialog{width:min(460px,calc(100% - 28px));padding:0;border:1px solid #365148;border-radius:15px;background:#0c2030;color:var(--ink);box-shadow:0 25px 90px #000b}
dialog::backdrop{background:#020a10c9;backdrop-filter:blur(4px)}
.dialog-inner{padding:25px}
.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.dialog-head h2{font:28px/1.1 Georgia,serif;margin:5px 0}
.close-btn{border:1px solid var(--line);background:#0a1a27;color:var(--muted);border-radius:7px;width:34px;height:34px;font-size:20px}
.field{margin:0 0 16px}
.field label{display:block;color:#c1d3d0;font-size:13px;margin-bottom:7px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#081925;color:var(--ink);padding:11px 12px;outline:none}
.field textarea{resize:vertical;min-height:88px}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
.cancel-btn{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:10px 14px}
.save-btn{border:0;background:var(--green);color:#102018;border-radius:8px;padding:10px 16px;font-weight:750}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:980px){.sidebar{width:220px}.main{margin-left:220px;padding-inline:25px}.stats{gap:11px}.stat-card{padding:20px}.tasks-panel{padding:23px 20px}}
@media(max-width:700px){.sidebar{position:relative;width:auto;height:auto;inset:auto;padding:13px 18px;display:block;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:21px}.brand-mark{width:38px;height:38px}.menu-label,.side-bottom{display:none}.nav-list{display:flex;gap:6px;margin-top:13px;overflow:auto;padding-bottom:2px}.nav-item{width:auto;flex:1;justify-content:center;gap:7px;padding:9px 10px;white-space:nowrap;font-size:13px}.nav-icon{font-size:15px;width:auto}.main{margin:0;padding:24px 17px 35px}.page-head{margin-bottom:23px}.date-pill{font-size:11px;padding:9px 10px}.stats{gap:8px;margin-bottom:23px}.stat-card{min-height:106px;padding:15px 13px;border-radius:11px}.stat-name{font-size:11px}.stat-value{font-size:33px;margin-top:14px}.tasks-panel{min-height:360px;padding:20px 14px;border-radius:13px}.panel-head h2{font-size:22px}.add-btn{padding:10px 12px;font-size:13px}.task-row{grid-template-columns:20px 1fr;gap:10px;padding:12px}.task-actions{grid-column:2;justify-content:space-between}.task-meta{font-size:11px}}
@media(max-width:390px){.page-head{display:block}.date-pill{display:inline-block;margin-top:13px}.stats{grid-template-columns:1fr}.stat-card{min-height:82px;display:flex;align-items:center;justify-content:space-between}.stat-value{margin:0;font-size:30px}.nav-item{font-size:12px;padding-inline:6px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span>Kaveri <b>Tasks</b></span>
    </a>

    <div class="menu-label">Workspace</div>
    <nav class="nav-list" aria-label="Task views">
      <button class="nav-item active" data-filter="all" aria-current="page">
        <span class="nav-icon" aria-hidden="true">▦</span>All Tasks
      </button>
      <button class="nav-item" data-filter="pending">
        <span class="nav-icon" aria-hidden="true">◷</span>Pending
      </button>
      <button class="nav-item" data-filter="completed">
        <span class="nav-icon" aria-hidden="true">✓</span>Completed
      </button>
    </nav>

    <div class="side-bottom">
      <p>Stay focused. Get things done.</p>
      <a href="index.html">← Back to portfolio</a>
    </div>
  </aside>

  <main class="main">
    <div class="main-inner">
      <header class="page-head">
        <div>
          <div class="eyebrow">Welcome back</div>
          <h1>My Workspace</h1>
        </div>
        <div class="date-pill" id="today-date"></div>
      </header>

      <section class="stats" aria-label="Task summary">
        <article class="stat-card">
          <div class="stat-name">Total Tasks</div>
          <div class="stat-value" id="total-count">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-name">Pending Tasks</div>
          <div class="stat-value" id="pending-count">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-name">Completed Tasks</div>
          <div class="stat-value" id="completed-count">0</div>
        </article>
      </section>

      <section class="tasks-panel" aria-labelledby="tasks-heading">
        <div class="panel-head">
          <div>
            <div class="eyebrow">Your productivity</div>
            <h2 id="tasks-heading">My Tasks</h2>
          </div>
          <button class="add-btn" id="open-dialog" type="button">＋ Add Task</button>
        </div>

        <label class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <span class="sr-only">Search your tasks</span>
          <input class="search" id="search" type="search" placeholder="Search your tasks...">
        </label>

        <div class="task-list" id="task-list" aria-live="polite"></div>
      </section>
    </div>
  </main>
</div>

<dialog id="task-dialog" aria-labelledby="dialog-title">
  <form class="dialog-inner" id="task-form">
    <div class="dialog-head">
      <div>
        <div class="eyebrow">New task</div>
        <h2 id="dialog-title">Add a task</h2>
      </div>
      <button class="close-btn" id="close-dialog" type="button" aria-label="Close">×</button>
    </div>

    <div class="field">
      <label for="task-title">Task name</label>
      <input id="task-title" name="title" maxlength="120" placeholder="e.g. Finish portfolio homepage" required>
    </div>
    <div class="field">
      <label for="task-details">Details <span style="color:var(--muted)">(optional)</span></label>
      <textarea id="task-details" name="details" maxlength="280" placeholder="Add a note or next step..."></textarea>
    </div>
    <div class="field">
      <label for="task-due">Due date <span style="color:var(--muted)">(optional)</span></label>
      <input id="task-due" name="due" type="date">
    </div>

    <div class="form-actions">
      <button class="cancel-btn" id="cancel-dialog" type="button">Cancel</button>
      <button class="save-btn" type="submit">Save task</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const STORAGE_KEY = "kaveriTodoTasksV1";
  let tasks = [];
  let filter = "all";
  let query = "";

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    if (Array.isArray(saved)) {
      tasks = saved
        .map(task => ({
          id: task.id || String(Date.now() + Math.random()),
          title: task.title || task.text || "",
          details: task.details || "",
          due: task.due || "",
          done: Boolean(task.done),
          createdAt: task.createdAt || null
        }))
        .filter(task => task.title);
    }
  } catch {
    tasks = [];
  }

  const list = document.querySelector("#task-list");
  const dialog = document.querySelector("#task-dialog");
  const form = document.querySelector("#task-form");
  const titleInput = document.querySelector("#task-title");
  const detailsInput = document.querySelector("#task-details");
  const dueInput = document.querySelector("#task-due");
  const searchInput = document.querySelector("#search");

  const today = new Date();
  document.querySelector("#today-date").textContent =
    new Intl.DateTimeFormat("en-GB", {
      weekday: "short",
      day: "2-digit",
      month: "long",
      year: "numeric"
    }).format(today);

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch {
      // The app remains usable if browser storage is unavailable.
    }
  }

  function render() {
    const completed = tasks.filter(task => task.done).length;

    document.querySelector("#total-count").textContent = tasks.length;
    document.querySelector("#pending-count").textContent = tasks.length - completed;
    document.querySelector("#completed-count").textContent = completed;

    const visible = tasks.filter(task => {
      const matchesFilter =
        filter === "all" ||
        (filter === "pending" && !task.done) ||
        (filter === "completed" && task.done);

      const text = `${task.title} ${task.details || ""}`.toLocaleLowerCase();
      return matchesFilter && text.includes(query.toLocaleLowerCase());
    });

    list.replaceChildren();

    if (!visible.length) {
      const empty = document.createElement("div");
      empty.className = "empty";

      const icon = document.createElement("div");
      icon.className = "empty-icon";
      icon.textContent = query ? "⌕" : filter === "completed" ? "✓" : "✦";

      const headline = document.createElement("strong");
      headline.textContent = query
        ? "No matching tasks."
        : filter === "pending" && tasks.length
          ? "You’re all caught up!"
          : filter === "completed" && tasks.length
            ? "No completed tasks yet."
            : "No tasks yet. Add your first task!";

      const hint = document.createElement("p");
      hint.textContent = query
        ? "Try a different search."
        : filter === "all"
          ? "Use “Add Task” to start your list."
          : "";

      empty.append(icon, headline, hint);
      list.append(empty);
      return;
    }

    visible.forEach(task => {
      const row = document.createElement("article");
      row.className = "task-row" + (task.done ? " completed" : "");

      const check = document.createElement("input");
      check.type = "checkbox";
      check.className = "task-check";
      check.checked = Boolean(task.done);
      check.setAttribute(
        "aria-label",
        (task.done ? "Mark pending: " : "Complete: ") + task.title
      );
      check.addEventListener("change", () => {
        task.done = check.checked;
        task.completedAt = task.done ? new Date().toISOString() : null;
        save();
        render();
      });

      const copy = document.createElement("div");
      copy.className = "task-copy";

      const name = document.createElement("div");
      name.className = "task-title";
      name.textContent = task.title;

      const meta = document.createElement("div");
      meta.className = "task-meta";

      const notes = task.details || "";
      const due = task.due
        ? `Due ${new Intl.DateTimeFormat("en-GB", {
            day: "numeric",
            month: "short",
            year: "numeric"
          }).format(new Date(task.due + "T12:00:00"))}`
        : "";
      const created = task.createdAt
        ? `Added ${new Intl.DateTimeFormat("en-GB", {
            day: "numeric",
            month: "short"
          }).format(new Date(task.createdAt))}`
        : "";

      meta.textContent = [notes, due, created].filter(Boolean).join(" · ");
      copy.append(name, meta);

      const actions = document.createElement("div");
      actions.className = "task-actions";

      const badge = document.createElement("span");
      badge.className = "status" + (task.done ? " done" : "");
      badge.textContent = task.done ? "Completed" : "Pending";

      const remove = document.createElement("button");
      remove.className = "delete-btn";
      remove.type = "button";
      remove.textContent = "Delete";
      remove.setAttribute("aria-label", "Delete task: " + task.title);
      remove.addEventListener("click", () => {
        tasks = tasks.filter(item => item.id !== task.id);
        save();
        render();
      });

      actions.append(badge, remove);
      row.append(check, copy, actions);
      list.append(row);
    });
  }

  document.querySelectorAll(".nav-item").forEach(button => {
    button.addEventListener("click", () => {
      filter = button.dataset.filter;

      document.querySelectorAll(".nav-item").forEach(item => {
        const active = item === button;
        item.classList.toggle("active", active);

        if (active) {
          item.setAttribute("aria-current", "page");
        } else {
          item.removeAttribute("aria-current");
        }
      });

      render();
    });
  });

  searchInput.addEventListener("input", () => {
    query = searchInput.value.trim();
    render();
  });

  document.querySelector("#open-dialog").addEventListener("click", () => {
    dialog.showModal();
    titleInput.focus();
  });

  function closeDialog() {
    dialog.close();
    form.reset();
  }

  document.querySelector("#close-dialog").addEventListener("click", closeDialog);
  document.querySelector("#cancel-dialog").addEventListener("click", closeDialog);

  dialog.addEventListener("click", event => {
    if (event.target === dialog) closeDialog();
  });

  form.addEventListener("submit", event => {
    event.preventDefault();

    const title = titleInput.value.trim();
    if (!title) return;

    tasks.unshift({
      id: crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now() + Math.random()),
      title,
      details: detailsInput.value.trim(),
      due: dueInput.value,
      done: false,
      createdAt: new Date().toISOString()
    });

    save();
    closeDialog();

    query = "";
    searchInput.value = "";
    filter = "all";

    document.querySelectorAll(".nav-item").forEach(item => {
      const active = item.dataset.filter === "all";
      item.classList.toggle("active", active);

      if (active) {
        item.setAttribute("aria-current", "page");
      } else {
        item.removeAttribute("aria-current");
      }
    });

    render();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && dialog.open) closeDialog();
  });

  render();
})();
</script>
</body>
</html>
